# Vertragstest bei jedem Push: baut das Image, startet den Container und lässt den
# öffentlichen Vertragstest dagegen laufen. Grüner Haken = Vertrag erfüllt.
# Liegt bereits in der Vorlage unter .github/workflows/pruefen.yml
# Voraussetzung: Repository-Secret OPENROUTER_API_KEY (Settings -> Secrets and variables -> Actions)
name: Vertragstest

on:
  push:
  workflow_dispatch:

jobs:
  pruefen:
    if: github.repository != 'prof-sky/fse-hausarbeit'  # nicht in der Vorlage selbst
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Image bauen
        run: docker build -t dienst .

      - name: Container starten
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          docker run -d --name dienst -p 8080:8080 -e OPENROUTER_API_KEY dienst
          for i in $(seq 30); do curl -sf http://localhost:8080/health && exit 0; sleep 2; done
          echo "Dienst antwortet nicht auf /health"; docker logs dienst; exit 1

      - name: Vertragstest
        run: |
          # eigene Kopie im Repo verwenden, sonst die aktuelle Fassung aus dem Vorlage-Repository laden
          [ -f vertragstest.py ] || curl -sSfL -o vertragstest.py https://raw.githubusercontent.com/prof-sky/fse-hausarbeit/main/vertragstest.py
          python3 vertragstest.py --url http://localhost:8080

      - name: Container-Log
        if: always()
        run: docker logs dienst 2>&1 | tail -100 || true
