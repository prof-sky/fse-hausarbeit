<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root { --hg: #f4f5f7; --karte: #fff; --text: #1e293b; --leise: #64748b; --ich: #e8710a; --rand: #e2e8f0; }
  @media (prefers-color-scheme: dark) {
    :root { --hg: #0f172a; --karte: #1e293b; --text: #e2e8f0; --leise: #94a3b8; --rand: #334155; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--hg); color: var(--text);
         display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--rand); font-weight: 600; }
  header small { color: var(--leise); font-weight: 400; margin-left: 8px; }
  #verlauf { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px;
             max-width: 720px; width: 100%; margin: 0 auto; }
  .blase { max-width: 80%; padding: 8px 12px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap;
           word-wrap: break-word; }
  .ich { align-self: flex-end; background: var(--ich); color: #fff; border-bottom-right-radius: 4px; }
  .du { align-self: flex-start; background: var(--karte); border: 1px solid var(--rand); border-bottom-left-radius: 4px; }
  .info { align-self: center; color: var(--leise); font-size: 13px; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--rand);
         max-width: 720px; width: 100%; margin: 0 auto; }
  input { flex: 1; padding: 10px 12px; font-size: 16px; border: 1px solid var(--rand); border-radius: 10px;
          background: var(--karte); color: var(--text); }
  button { padding: 10px 16px; font-size: 16px; border: 0; border-radius: 10px; background: var(--ich); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>Chat <small id="sitzung"></small></header>
<div id="verlauf"><div class="info">Gespräch über /chat; mit /?session=&lt;id&gt; lässt sich eine bestehende Session fortsetzen.</div></div>
<form id="formular">
  <input id="eingabe" maxlength="500" autocomplete="off" placeholder="Nachricht schreiben" autofocus>
  <button id="senden">Senden</button>
</form>
<script>
  // gleiche Session wie über die API: /?session=<id> setzt ein bestehendes Gespräch fort
  const vorgabe = new URLSearchParams(location.search).get("session");
  const session = /^[A-Za-z0-9_-]{1,64}$/.test(vorgabe || "") ? vorgabe : "web-" + crypto.randomUUID().slice(0, 8);
  document.getElementById("sitzung").textContent = "Session " + session;
  const verlauf = document.getElementById("verlauf");
  const eingabe = document.getElementById("eingabe");
  const senden = document.getElementById("senden");

  function blase(text, klasse) {
    const d = document.createElement("div");
    d.className = "blase " + klasse;
    d.textContent = text;
    verlauf.appendChild(d);
    verlauf.scrollTop = verlauf.scrollHeight;
    return d;
  }

  document.getElementById("formular").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = eingabe.value.trim();
    if (!text) return;
    blase(text, "ich");
    eingabe.value = "";
    senden.disabled = true;
    const tippt = blase("schreibt …", "info");
    try {
      const r = await fetch("chat?" + new URLSearchParams({ session, message: text }));
      const daten = await r.json();
      tippt.remove();
      if (r.ok) blase(daten.reply, "du");
      else blase("Fehler " + r.status + ": " + (daten.detail || daten.title), "info");
    } catch (fehler) {
      tippt.remove();
      blase("Keine Verbindung zum Dienst.", "info");
    }
    senden.disabled = false;
    eingabe.focus();
  });
</script>
</body>
</html>
